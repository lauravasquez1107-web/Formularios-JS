<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Login Validado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2  class="mb-4 text-primary">Formulario con validacion </h2>

  <form id="formulario">

    <div class="mb-3">
      <label class="form-label">Usuario:</label>
      <input type="text" class="form-control" id="usuario">
      <div id="errorUsuario" class="form-text"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña:</label>

      <div class="input-group">
        <input type="password" class="form-control" id="password">
        <button type="button" class="btn btn-outline-secondary" id="togglePassword">
          Mostrar
        </button>
      </div>

      <div id="contador" class="form-text text-info"></div>
      <div id="errorPassword" class="form-text"></div>
    </div>

    <button type="submit" class="btn btn-success">Enviar</button>

    <div id="mensajeEnvio" class="mt-3 fw-bold"></div>

  </form>
</div>

<script src="validacion.js"></script>
</body>
</html>
